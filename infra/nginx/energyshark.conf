# EnergyShark — Nginx reverse proxy (host EC2)
# Ruta en el host: /etc/nginx/sites-available/energyshark
# (generada por Certbot · Let's Encrypt en la Etapa 11; symlink a sites-enabled)

# Redirección HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name persito.online www.persito.online;

    if ($host = www.persito.online) {
        return 301 https://$host$request_uri;
    }
    if ($host = persito.online) {
        return 301 https://$host$request_uri;
    }
    return 404;
}

# Server block HTTPS (proxy a master)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name persito.online www.persito.online;

    ssl_certificate /etc/letsencrypt/live/persito.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/persito.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
