# EnergyShark — Nginx reverse proxy (host EC2)
# Ruta en el host: /etc/nginx/sites-available/energyshark
# (generada por Certbot · Let's Encrypt en la Etapa 11; symlink a sites-enabled)

# Server block HTTPS (proxy a master)
server {
    server_tokens off;
    server_name persito.online www.persito.online;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/persito.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/persito.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Server block HTTP → redirección a HTTPS
server {
    server_tokens off;

    if ($host = www.persito.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = persito.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name persito.online www.persito.online;
    return 404; # managed by Certbot
}
