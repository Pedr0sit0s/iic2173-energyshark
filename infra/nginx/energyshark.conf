# EnergyShark — Nginx reverse proxy (host EC2)
# Ruta en el host: /etc/nginx/sites-available/energyshark
# (symlink a sites-enabled; se deshabilitó el site default de Ubuntu)

server {
    listen 80;
    listen [::]:80;
    server_name persito.online www.persito.online;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
