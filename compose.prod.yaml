name: energyshark

services:
  master:
    build: ./apps/master
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL: "true"
    ports:
      - "127.0.0.1:3000:3000"
    command: sh -c "npm run migration:run:prod && node dist/main"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  connector:
    build: ./apps/connector
    environment:
      NODE_ENV: production
      MASTER_URL: http://master:3000
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-observer.45.q}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-5000}
      MAX_FORWARD_RETRIES: ${MAX_FORWARD_RETRIES:-5}
    depends_on:
      master:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/connector-heartbeat) )) -lt 15"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
