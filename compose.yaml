name: energyshark

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-energy_db}
    volumes:
      - energy_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  master:
    build:
      context: ./apps/master
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-energy_db}
      DB_SSL: "false"
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    command: ["sh", "-c", "npm run migration:run:prod && node dist/main"]
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  connector:
    build:
      context: ./apps/connector
    environment:
      NODE_ENV: production
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-observer.45.q}
      MASTER_URL: http://master:3000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-5000}
      MAX_FORWARD_RETRIES: ${MAX_FORWARD_RETRIES:-5}
    depends_on:
      master:
        condition: service_healthy
    restart: unless-stopped

volumes:
  energy_pgdata:
